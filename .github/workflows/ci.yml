name: CI

# A signal, not a gate: a red run blocks nothing until a branch protection rule or ruleset
# requires this check. A human reads it.

# Every push on every branch, and every pull request, so a pull request from a fork is checked
# too. A pull request from a branch of this repository therefore runs twice: once for the
# push and once for the pull request. A fork's pull request runs with a read-only token and no
# secrets; this workflow needs neither.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # The image's Python (Dockerfile: python:3.12-slim).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      # The image's pinned set, then this package and its test tools. ruff is pinned to the
      # engine's version: newer releases also format Markdown code blocks, which would turn
      # the format check red with no code change.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]" "ruff==0.15.20"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: pytest
        run: pytest -q

      # Known vulnerabilities in the image's pinned dependencies fail the job.
      - name: pip-audit the pinned dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.lock

  # What a user gets from `pip install .`: a fresh virtual environment, a regular (not
  # editable) install, no dev extras and no lock file, on Python 3.11, 3.12 and 3.13.
  # pyproject.toml admits any Python >= 3.11; versions after 3.13 are not tested here. The
  # checks run outside the checkout, so they import the installed package and not the source
  # tree.
  install:
    name: install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: pip install . into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install .

      - name: orinyx --help
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/orinyx" --help

      # Imports the package and both servers' modules without starting either:
      # `python -m orinyx_mcp` would serve over stdio.
      - name: import check
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" -c "import orinyx_mcp, orinyx_mcp.server, orinyx_mcp.http"
