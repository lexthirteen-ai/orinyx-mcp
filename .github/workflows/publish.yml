name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check build inputs
        run: python -I scripts/check_build_inputs.py .
      - name: Require tag to match the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -I - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path("orinyx_mcp/__init__.py").read_text()
          version = re.search(r'^__version__ = "([^"]+)"$', source, re.MULTILINE).group(1)
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Release tag must match orinyx_mcp.__version__")
          PY
      - name: Install test and build tools
        run: |
          python -I -m pip install -r requirements.lock
          python -I -m pip install ".[dev]" build twine
      - name: Test
        run: python -I -m pytest -q
      - name: Build and validate wheel and sdist
        run: |
          python -I -m build
          python -I -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/orinyx-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
