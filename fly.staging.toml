# Staging for the hosted MCP (CHA-72). Sleeps when idle; wakes on the first request.
app = "orinyx-mcp-staging"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  MCP_PUBLIC_URL = "https://orinyx-mcp-staging.fly.dev"
  ORINYX_API_URL = "http://orinyx-api-staging.internal:8000"
  ORINYX_API_ALLOW_HTTP = "true"
  ORINYX_ISSUER_URL = "https://orinyx-api-staging.fly.dev"
  TRUST_PROXY_FORWARDED_FOR = "true"
  TRUSTED_CLIENT_IP_HEADER = "fly-client-ip"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
